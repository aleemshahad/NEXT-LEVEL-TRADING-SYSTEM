# ========================================
# NEXUS TRADING SYSTEM - CONFIGURATION
# ========================================

# GLOBAL SETTINGS
symbols: ["XAUUSDm"]
strategy: "Hybrid Mode"
timeframe: "M15"

# BACKTESTER COST / TIMEZONE SETTINGS (backtesting.py only)
backtest:
  starting_balance: 100000.0
  risk_per_trade: 0.03          # fraction of equity risked per trade
  commission_per_lot: 0.0       # round-turn commission per lot (0 = broker free)
  server_to_est_offset_hours: 0 # MT5 bars are BROKER SERVER time; subtract this to get NY time
                                # e.g. GMT+2/+3 broker => 7 ; GMT+0 => 5 (US summer), 4 (US winter)

# RISK MANAGEMENT
risk:
  max_risk_per_trade: 0.02
  max_daily_loss: 0.05
  max_drawdown: 0.50
  global_profit_target_usd: 100
  circuit_breaker_loss_pct: 5.0
  circuit_breaker_cooldown_min: 120
  use_stop_loss: false

# GRID / DCA SETTINGS
grid:
  mode: BOTH
  lot_size: 0.05
  lot_growth: 1.3
  max_order_lot: 0.20
  max_total_exposure: 0.20
  max_open_layers: 6            # backtester caps simultaneous grid layers at this
  profit_target_usd: 10
  profit_target_pct: 0.25
  trailing_enabled: false
  volume_flow_filter: true
  flow_surge_threshold: 1.5
  flow_obv_short: 5
  flow_obv_long: 20
  flow_min_score: 0.6

# FIBONACCI-ANCHORED DCA ENGINE
fib_dca:
  enabled: true
  lookback_bars: 40
  max_open_layers: 3
  proximity_tolerance: 0.40
  body_ratio_limit: 0.70
  wick_ratio_min: 0.20
  freeze_on_gchannel_flip: true

# NEWS SETTINGS
news:
  block_window_min: 30
  download_interval_h: 1

# ICT SMART MONEY CONFIGURATION
ict:
  enabled: true
  risk_percent: 0.5
  lookback_bars: 50
  choch_lookback: 20
  ob_lookback: 30
  fvg_lookback: 30
  min_confluence: 3
  kill_zones:
    london:
      start: "02:00"
      end: "05:00"
    new_york:
      start: "07:00"
      end: "10:00"
  sweep_min_wick_ratio: 0.3
  sweep_confirm_bars: 2
  sl_atr_mult: 1.5
  tp_min_risk_reward: 2.0
  tp_prefer_rr: 3.0

  # TP LADDER — code-managed partial exits (levels come from trading_brain)
  manage_partial_exits: true
  tp1_close_pct: 40.0
  tp2_close_pct: 30.0
  tp3_close_pct: 30.0
  move_sl_to_breakeven: true
